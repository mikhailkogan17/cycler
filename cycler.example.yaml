# cycler — the whole configuration, in one file.
#
#   ~/.config/cycler/config.yaml     (or $XDG_CONFIG_HOME/cycler/config.yaml, or $CYCLER_CONFIG)
#
# /cycler:start writes this for you. There is no second file: the Linear credentials, the repo and
# the workflows all live here. ~/.cycler/ holds only state the poller writes — the refreshing OAuth
# token, the processed-issue list, the launchd logs — and nothing you ever edit.
#
# This file is NOT in your repo, so the credentials below are not one `git add .` away from a public
# history. Every key is optional and has a working default; the four sections here are the ones worth
# setting. The full reference — every key, its default, and when to reach for it — is in
# docs/specs/002-config.md.

linear:
  # From Linear → Settings → API → Applications → your "Claude" application.
  # An OAuth application, not a personal API key: a personal key acts as YOU, and an issue is
  # delegated to an AGENT. The app is what puts the name "Claude" on the board.
  client_id: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  client_secret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

repo:
  path: ~/your-repo        # where sessions are started
  base: main               # PR base branch
  branch_prefix: claude/   # branches are <branch_prefix><ISSUE-KEY>

workflows:
  # `default` is the workflow for an issue with no matching label. Every other key IS a Linear label,
  # matched case-insensitively, first match wins. A lookup on a label a human already wrote —
  # deliberately not a classifier: a model here would infer, less reliably, something already
  # recorded, and a router that returns the default for everything is indistinguishable from a
  # working one until something audits it.
  #
  # The value is always a WORKFLOW — the `workflow-` prefixed half of the /cycler: namespace. The
  # other half (start, stop, delegate, doctor) are commands you run; routing an issue to one of
  # those dispatches a session that configures the poller instead of doing the work.
  default: /cycler:workflow-feature    # contract → implement → audit → gate → PR
  feature: /cycler:workflow-feature    # the same thing, said out loud, for the Feature label
  bug: /cycler:workflow-bug            # that lifecycle in fix mode: the regression test before the fix
  research: /cycler:workflow-research  # a decision, not a diff — nothing to gate or audit

dispatch:
  # The whole command, as a template: {workflow} {issue} {title} {url} {session}.
  # Do NOT add --print: it conflicts with --background and claude exits 1, which looks exactly like
  # "the agent never saw the issue".
  #
  # Keep {title} out of an argument of its own. Placeholders are substituted AFTER the template is
  # split into arguments, so a title can never introduce an EXTRA argument — but it still controls
  # the CONTENT of the one it lands in, and an argument that is entirely a title starts with
  # whatever the title starts with. A title of "--dangerously-skip-permissions" placed as a bare
  # {title} token becomes exactly that flag. The default is safe because {session} is always
  # "[KEY] <title>", so the argument can never begin with a dash. Anyone who can assign to the agent already
  # has shell-equivalent access to this machine (see the Security section of the README), so this is
  # not an escalation — it is a footgun worth not building into your own template.
  command: >
    claude --background --name "{session}" --remote-control "{session}"
    --remote-control-session-name-prefix linear --permission-mode auto
    --append-system-prompt "Started by cycler for {issue}" "{workflow} {issue}"

  # launchd hands a job PATH=/usr/bin:/bin:/usr/sbin:/sbin. The dispatched session inherits it, so
  # without this it cannot find node, gh, claude or lin and stalls asking a human. An interactive
  # session never sees this, which is why it only shows up once dispatch is automated.
  path_prepend: [~/.local/bin, ~/bin, /opt/homebrew/bin, /usr/local/bin]

# The gate is not a key here — it is a file in your repo:
#
#   .claude/harness/gate.sh
#
# That file wins whenever it exists. Without it, cycler runs lint, build and test from package.json.
# A repo with neither reports FAIL, not a pass. Start from the plugin's harness/gate.default.sh and
# replace the checks; the runner is what you inherit. Full behaviour: docs/specs/003-gate.md.

# Also available, and left out here because almost nobody overrides them:
#   dispatch.start_grace_seconds / dispatch.max_attempts   how long a session gets to post its start
#                         marker before it is declared dead, and how many times it is re-dispatched
#   dispatch.max_concurrent   how many dispatched sessions may run at once (default 1). Raise it only
#                         with a reason: each run fans out to several subagents against one shared
#                         usage pool, and two at once is what exhausted it. 0 means no limit.
#   dispatch.cooldown_fallback_minutes   after a session dies on the account usage limit the poller
#                         waits for the reset named in that message; this is the fallback when the
#                         message has no readable reset time (default 60).
#   verify.steps          slow checks the gate leaves out, run by the verify agent
#   worktree.link_workspace / worktree.bootstrap   what a fresh worktree needs before it can build
#   escape_hatch.max_files / escape_hatch.paths    past these, run the full workflow, not inline
#   launchd.label         the polling job's label and plist filename
# All of them are documented in full, with defaults, in docs/specs/002-config.md.
